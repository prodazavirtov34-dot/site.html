<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch PointAuction & Roulette</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0e0e10; color: #efeff1; }
        .twitch-purple { background-color: #9146FF; }
        .twitch-purple:hover { background-color: #772ce8; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-[#18181b] border-b border-[#26262c] px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="twitch-purple text-white p-2.5 rounded-xl font-bold text-xl flex items-center justify-center shadow-lg shadow-purple-900/30">
                <i class="fa-solid fa-gavel"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-xl tracking-tight text-white">Twitch PointAuction</h1>
                <p class="text-xs text-zinc-400">Аукцион за баллы канала</p>
            </div>
        </div>

        <div id="auth-container">
            <button onclick="loginWithTwitch()" class="twitch-purple text-white font-semibold px-5 py-2.5 rounded-xl shadow-lg flex items-center space-x-2.5 transition transform active:scale-95 cursor-pointer">
                <i class="fa-brands fa-twitch text-lg"></i>
                <span>Войти через Twitch</span>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="space-y-6">
            <div class="bg-[#18181b] border border-[#26262c] rounded-2xl p-5 shadow-xl">
                <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-purple-400"></i> Добавить лот
                </h2>
                <form onsubmit="addLot(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-zinc-400 mb-1">Название лота</label>
                        <input type="text" id="lot-title" required placeholder="Например: Пройти игру" class="w-full bg-[#0e0e10] border border-[#26262c] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-400 mb-1">Начальная ставка (баллы 🪙)</label>
                        <input type="number" id="lot-bid" min="0" value="100" class="w-full bg-[#0e0e10] border border-[#26262c] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                    </div>
                    <button type="submit" class="w-full twitch-purple text-white font-semibold py-2.5 rounded-xl transition cursor-pointer">Добавить в список</button>
                </form>
            </div>

            <div class="bg-[#18181b] border border-[#26262c] rounded-2xl p-5 shadow-xl">
                <h2 class="text-lg font-bold text-white mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-amber-400"></i> Симулятор ставок
                </h2>
                <div class="space-y-3">
                    <input type="text" id="sim-user" placeholder="Ник зрителя (@Username)" class="w-full bg-[#0e0e10] border border-[#26262c] rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="sim-amount" placeholder="Баллы" value="500" class="w-full bg-[#0e0e10] border border-[#26262c] rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                        <select id="sim-lot-select" class="w-full bg-[#0e0e10] border border-[#26262c] rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500"></select>
                    </div>
                    <button onclick="simulateRedemption()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-semibold py-2 rounded-xl transition cursor-pointer text-sm">Закинуть баллы</button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-6">
            <div class="bg-[#18181b] border border-[#26262c] rounded-2xl p-5 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-purple-400"></i> Активные лоты
                    </h2>
                    <div class="flex items-center gap-2">
                        <button onclick="spinRoulette()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition cursor-pointer">Крутить рулетку</button>
                        <button onclick="clearLots()" class="bg-red-900/40 hover:bg-red-900/60 text-red-300 px-3 py-2 rounded-xl text-xs transition cursor-pointer">Очистить</button>
                    </div>
                </div>
                <div id="lots-list" class="space-y-3 max-h-[420px] overflow-y-auto pr-1">
                    <div class="text-center py-10 text-zinc-500 text-sm">Список лотов пуст.</div>
                </div>
            </div>

            <div id="roulette-box" class="hidden bg-[#18181b] border border-purple-500/50 rounded-2xl p-6 text-center shadow-2xl relative overflow-hidden">
                <h3 class="text-sm font-semibold uppercase tracking-wider text-purple-400 mb-1">Победитель рулетки</h3>
                <div id="roulette-winner" class="text-3xl font-extrabold text-white mt-2 animate-bounce">Крутим...</div>
            </div>
        </div>
    </main>

    <script>
        const CLIENT_ID = 'jwk4v6qrymwe3odjf13oaif4';
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        let lots = JSON.parse(localStorage.getItem('twitch_auction_lots')) || [];
        let processedTransactions = new Set(JSON.parse(localStorage.getItem('twitch_processed_tx')) || []);

        window.onload = function() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');

            if (accessToken) {
                localStorage.setItem('twitch_token', accessToken);
                window.history.replaceState({}, document.title, window.location.pathname);
                fetchUserProfile(accessToken);
            } else {
                const savedToken = localStorage.getItem('twitch_token');
                if (savedToken) {
                    fetchUserProfile(savedToken);
                }
            }
            renderLots();
        };

        function loginWithTwitch() {
            const scopes = ['channel:read:redemptions', 'channel:manage:redemptions', 'user:read:email'].join('%20');
            const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${scopes}&force_verify=true`;
            window.location.href = authUrl;
        }

        async function fetchUserProfile(token) {
            try {
                const response = await fetch('https://api.twitch.tv/helix/users', {
                    headers: { 'Client-ID': CLIENT_ID, 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.data && data.data.length > 0) {
                    const user = data.data[0];
                    document.getElementById('auth-container').innerHTML = `
                        <div class="flex items-center gap-3 bg-[#26262c] px-4 py-2 rounded-xl">
                            <img src="${user.profile_image_url}" class="w-8 h-8 rounded-full border border-purple-500" alt="Avatar">
                            <div class="text-left">
                                <div class="text-xs font-bold text-white">${user.display_name}</div>
                                <div class="text-[10px] text-emerald-400">● Авторизован</div>
                            </div>
                            <button onclick="logout()" class="ml-3 text-zinc-400 hover:text-red-400 text-xs"><i class="fa-solid fa-right-from-bracket"></i></button>
                        </div>
                    `;
                } else { logout(); }
            } catch (err) { logout(); }
        }

        function logout() {
            localStorage.removeItem('twitch_token');
            window.location.href = REDIRECT_URI;
        }

        function saveState() {
            localStorage.setItem('twitch_auction_lots', JSON.stringify(lots));
            localStorage.setItem('twitch_processed_tx', JSON.stringify([...processedTransactions]));
        }

        function addLot(e) {
            e.preventDefault();
            const title = document.getElementById('lot-title').value.trim();
            const bid = parseInt(document.getElementById('lot-bid').value) || 0;
            if(!title) return;
            lots.push({ id: Date.now(), title: title, bid: bid, leader: 'Нет ставок' });
            document.getElementById('lot-title').value = '';
            saveState();
            renderLots();
        }

        function renderLots() {
            const listEl = document.getElementById('lots-list');
            const selectEl = document.getElementById('sim-lot-select');
            selectEl.innerHTML = '';
            if (lots.length === 0) {
                listEl.innerHTML = `<div class="text-center py-10 text-zinc-500 text-sm">Список лотов пуст.</div>`;
                return;
            }
            listEl.innerHTML = '';
            lots.forEach((lot, index) => {
                const opt = document.createElement('option');
                opt.value = lot.id;
                opt.textContent = lot.title;
                selectEl.appendChild(opt);

                const card = document.createElement('div');
                card.className = `bg-[#0e0e10] border ${index === 0 ? 'border-purple-500/50' : 'border-[#26262c]'} rounded-xl p-4 flex items-center justify-between gap-4`;
                card.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-white text-sm truncate">${lot.title}</h4>
                        <div class="text-xs text-zinc-400 mt-0.5">Лидер: <span class="text-purple-400 font-medium">@${lot.leader}</span></div>
                    </div>
                    <div class="text-right">
                        <div class="text-sm font-extrabold text-amber-400">${lot.bid} 🪙</div>
                    </div>
                    <button onclick="removeLot(${lot.id})" class="text-zinc-500 hover:text-red-400 p-2"><i class="fa-solid fa-trash text-xs"></i></button>
                `;
                listEl.appendChild(card);
            });
        }

        function simulateRedemption() {
            const usernameInput = document.getElementById('sim-user').value.trim();
            const amount = parseInt(document.getElementById('sim-amount').value) || 0;
            const lotId = parseInt(document.getElementById('sim-lot-select').value);
            if (!usernameInput || amount <= 0 || !lotId) return;

            const txId = `${usernameInput}_${amount}_${lotId}_${Date.now()}`;
            if (processedTransactions.has(txId)) return;
            processedTransactions.add(txId);

            const lot = lots.find(l => l.id === lotId);
            if (lot) {
                lot.bid += amount;
                lot.leader = usernameInput.replace('@', '');
                saveState();
                renderLots();
                document.getElementById('sim-user').value = '';
            }
        }

        function removeLot(id) {
            lots = lots.filter(l => l.id !== id);
            saveState();
            renderLots();
        }

        function clearLots() {
            if(confirm('Очистить лоты?')) {
                lots = [];
                processedTransactions.clear();
                saveState();
                renderLots();
                document.getElementById('roulette-box').classList.add('hidden');
            }
        }

        function spinRoulette() {
            if (lots.length === 0) return;
            const rouletteBox = document.getElementById('roulette-box');
            const winnerEl = document.getElementById('roulette-winner');
            rouletteBox.classList.remove('hidden');

            let counter = 0;
            const interval = setInterval(() => {
                const randomLot = lots[Math.floor(Math.random() * lots.length)];
                winnerEl.textContent = `${randomLot.title} (@${randomLot.leader})`;
                counter++;
                if (counter > 12) {
                    clearInterval(interval);
                    const winner = lots[Math.floor(Math.random() * lots.length)];
                    winnerEl.textContent = `🎉 ПОБЕДИТЕЛЬ: ${winner.title} — @${winner.leader} (${winner.bid} 🪙)!`;
                }
            }, 80);
        }
    </script>
</body>
</html>
